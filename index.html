<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lienzo Corporal - Versión 13 (Velocidad OFF por defecto)</title>

  <!-- Soporte para instalar como App (PWA) en móviles y tablets -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2970/2970785.png">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background: #FFFFFF; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #FFFFFF;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      transition: opacity 0.3s;
    }

    video.hidden-cam {
      opacity: 0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 100;
      flex-wrap: wrap;
      max-width: 90vw;
      justify-content: flex-end;
    }

    button, .color-picker-wrapper {
      padding: 12px 20px;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: background-color 0.3s, opacity 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #color_picker_btn {
      background-color: #e83e8c;
      position: relative;
      overflow: hidden;
    }

    #color_picker_btn:hover { background-color: #d63384; }

    #color_picker_btn.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #color_picker {
      position: absolute;
      opacity: 0;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    #speed_color_btn { background-color: #20c997; }
    #speed_color_btn:hover { background-color: #19a178; }
    #speed_color_btn.off { background-color: #6c757d; }

    #toggle_cam_button { background-color: #6f42c1; }
    #toggle_cam_button:hover { background-color: #593196; }

    #joints_filter_btn { background-color: #fd7e14; }
    #joints_filter_btn:hover { background-color: #e06b0d; }

    #clear_button { background-color: #ffc107; color: #000; }
    #clear_button:hover { background-color: #e0a800; }

    #auto_photo_button { background-color: #17a2b8; }
    #auto_photo_button:hover { background-color: #138496; }
    #auto_photo_button.active { background-color: #dc3545; animation: pulse 1.5s infinite; }

    #save_button { background-color: #007bff; }
    #save_button:hover { background-color: #0056b3; }

    #record_button { background-color: #28a745; }
    #record_button:hover { background-color: #1e7e34; }
    #record_button.recording { background-color: #dc3545; animation: pulse 1.5s infinite; }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 350px;
      width: 80%;
    }

    .modal-content h3 { margin-top: 0; }

    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      width: 100%;
    }

    .joints-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: left;
      margin-top: 15px;
      max-height: 250px;
      overflow-y: auto;
    }

    .joints-grid label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-camera { background-color: #17a2b8; }
    .btn-white { background-color: #6c757d; }
    .btn-cancel { background-color: #dc3545; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <video id="webcam" playinline autoplay muted></video>
    <canvas id="trail_canvas"></canvas>
    <canvas id="output_canvas"></canvas>
    
    <div class="controls">
      <button id="speed_color_btn" class="off">⚡ Color Velocidad: OFF</button>
      <div class="color-picker-wrapper" id="color_picker_btn">
        🖌️ Color Trazo
        <input type="color" id="color_picker" value="#000000">
      </div>
      <button id="toggle_cam_button">👁️ Ocultar Cámara</button>
      <button id="joints_filter_btn">🦴 Articulaciones</button>
      <button id="clear_button">🧹 Borrar Lienzo</button>
      <button id="auto_photo_button">⏱️ Foto Auto (30s)</button>
      <button id="record_button">🔴 Grabar Vídeo</button>
      <button id="save_button">📷 Guardar Foto</button>
    </div>
  </div>

  <!-- Modal Filtro de Articulaciones -->
  <div id="joints_modal" class="modal">
    <div class="modal-content">
      <h3>Articulaciones Activas</h3>
      <p>Selecciona qué puntos dibujarán en el lienzo:</p>
      <div class="joints-grid">
        <label><input type="checkbox" id="joint_head" checked> 👤 Cabeza</label>
        <label><input type="checkbox" id="joint_shoulders" checked> 🦾 Hombros</label>
        <label><input type="checkbox" id="joint_elbows" checked> 🦾 Codos</label>
        <label><input type="checkbox" id="joint_hands" checked> ✋ Manos</label>
        <label><input type="checkbox" id="joint_hips" checked> 🦵 Caderas</label>
        <label><input type="checkbox" id="joint_knees" checked> 🦵 Rodillas</label>
        <label><input type="checkbox" id="joint_feet" checked> 🦶 Pies</label>
      </div>
      <div class="modal-buttons">
        <button class="btn-camera" id="close_joints_modal">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Modal Guardar Foto -->
  <div id="save_modal" class="modal">
    <div class="modal-content">
      <h3>Guardar Imagen</h3>
      <p>Elige el tipo de fondo que deseas para el dibujo:</p>
      <div class="modal-buttons">
        <button class="btn-camera" id="save_camera_bg">Fondo de la Cámara</button>
        <button class="btn-white" id="save_white_bg">Fondo Blanco</button>
        <button class="btn-cancel" id="cancel_modal">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const outputCanvas = document.getElementById('output_canvas');
    const trailCanvas = document.getElementById('trail_canvas');
    const saveButton = document.getElementById('save_button');
    const recordButton = document.getElementById('record_button');
    const autoPhotoButton = document.getElementById('auto_photo_button');
    const clearButton = document.getElementById('clear_button');
    const toggleCamButton = document.getElementById('toggle_cam_button');
    const jointsFilterBtn = document.getElementById('joints_filter_btn');
    const speedColorBtn = document.getElementById('speed_color_btn');
    const colorPickerBtn = document.getElementById('color_picker_btn');
    const colorPicker = document.getElementById('color_picker');
    
    const saveModal = document.getElementById('save_modal');
    const saveCameraBg = document.getElementById('save_camera_bg');
    const saveWhiteBg = document.getElementById('save_white_bg');
    const cancelModal = document.getElementById('cancel_modal');

    const jointsModal = document.getElementById('joints_modal');
    const closeJointsModal = document.getElementById('close_joints_modal');

    const ctx = outputCanvas.getContext('2d');
    const trailCtx = trailCanvas.getContext('2d');

    const MIN_DISTANCE = 2;
    const VISIBILITY_THRESHOLD = 0.85;

    let lastPositions = {};
    let lastMidPoints = {};
    let currentLineWidth = 2;
    let manualColor = '#000000';
    let isSpeedColorActive = false; // Configurado en OFF por defecto

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    let autoPhotoInterval = null;
    let isAutoPhotoActive = false;
    let isCameraVisible = true;

    // Cambiar color manual
    colorPicker.addEventListener('input', (e) => {
      manualColor = e.target.value;
    });

    // Activar / Desactivar color por velocidad
    speedColorBtn.addEventListener('click', () => {
      isSpeedColorActive = !isSpeedColorActive;
      if (isSpeedColorActive) {
        speedColorBtn.textContent = '⚡ Color Velocidad: ON';
        speedColorBtn.classList.remove('off');
        colorPicker.disabled = true;
        colorPickerBtn.classList.add('disabled');
      } else {
        speedColorBtn.textContent = '⚡ Color Velocidad: OFF';
        speedColorBtn.classList.add('off');
        colorPicker.disabled = false;
        colorPickerBtn.classList.remove('disabled');
      }
    });

    // Conmutador de vista de cámara
    toggleCamButton.addEventListener('click', () => {
      isCameraVisible = !isCameraVisible;
      if (isCameraVisible) {
        videoElement.classList.remove('hidden-cam');
        toggleCamButton.textContent = '👁️ Ocultar Cámara';
      } else {
        videoElement.classList.add('hidden-cam');
        toggleCamButton.textContent = '📷 Mostrar Cámara';
      }
    });

    // Control modal articulaciones
    jointsFilterBtn.addEventListener('click', () => {
      jointsModal.style.display = 'flex';
    });
    closeJointsModal.addEventListener('click', () => {
      jointsModal.style.display = 'none';
    });

    function isJointTypeEnabled(name) {
      if (name === 'head') return document.getElementById('joint_head').checked;
      if (name.includes('Shoulder')) return document.getElementById('joint_shoulders').checked;
      if (name.includes('Elbow')) return document.getElementById('joint_elbows').checked;
      if (name.includes('Hand')) return document.getElementById('joint_hands').checked;
      if (name.includes('Hip')) return document.getElementById('joint_hips').checked;
      if (name.includes('Knee')) return document.getElementById('joint_knees').checked;
      if (name.includes('Foot')) return document.getElementById('joint_feet').checked;
      return true;
    }

    // Borrar dibujo
    clearButton.addEventListener('click', () => {
      trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
    });

    function resizeCanvases() {
      outputCanvas.width = window.innerWidth;
      outputCanvas.height = window.innerHeight;
      trailCanvas.width = window.innerWidth;
      trailCanvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    function getDistance(p1, p2) {
      const dx = (p1.x - p2.x) * trailCanvas.width;
      const dy = (p1.y - p2.y) * trailCanvas.height;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function isInsideFrame(point) {
      const margin = 0.02;
      return point.x >= margin && point.x <= (1 - margin) && 
             point.y >= margin && point.y <= (1 - margin);
    }

    function calculateLineWidth(landmarks) {
      const leftShoulder = landmarks[11];
      const rightShoulder = landmarks[12];

      if (leftShoulder && rightShoulder && leftShoulder.visibility > VISIBILITY_THRESHOLD && rightShoulder.visibility > VISIBILITY_THRESHOLD) {
        const shoulderDist = Math.hypot(
          leftShoulder.x - rightShoulder.x,
          leftShoulder.y - rightShoulder.y
        );

        const minWidth = 0.5;
        const maxWidth = 20;
        const scaledWidth = Math.pow(shoulderDist * 3.2, 2) * 10;

        return Math.min(Math.max(scaledWidth, minWidth), maxWidth);
      }
      return 2;
    }

    function getColorBySpeed(distance) {
      const maxSpeed = 35;
      const speedRatio = Math.min(distance / maxSpeed, 1);

      const red = Math.round(255 * speedRatio);
      return `rgb(${red}, 0, 0)`;
    }

    function drawContinuousCurve(targetName, pPrev, pCurr, width, color) {
      const pPrevX = pPrev.x * trailCanvas.width;
      const pPrevY = pPrev.y * trailCanvas.height;
      const pCurrX = pCurr.x * trailCanvas.width;
      const pCurrY = pCurr.y * trailCanvas.height;

      const midX = (pPrevX + pCurrX) / 2;
      const midY = (pPrevY + pCurrY) / 2;

      trailCtx.beginPath();
      
      if (lastMidPoints[targetName]) {
        trailCtx.moveTo(lastMidPoints[targetName].x, lastMidPoints[targetName].y);
        trailCtx.quadraticCurveTo(pPrevX, pPrevY, midX, midY);
      } else {
        trailCtx.moveTo(pPrevX, pPrevY);
        trailCtx.lineTo(midX, midY);
      }

      trailCtx.strokeStyle = color;
      trailCtx.lineWidth = width;
      trailCtx.lineCap = 'round';
      trailCtx.lineJoin = 'round';
      trailCtx.stroke();

      lastMidPoints[targetName] = { x: midX, y: midY };
    }

    function drawJointMarker(point, color) {
      ctx.beginPath();
      ctx.arc(point.x * outputCanvas.width, point.y * outputCanvas.height, 5, 0, 2 * Math.PI);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#FFFFFF';
      ctx.stroke();
    }

    function onResults(results) {
      ctx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);

      if (results.poseLandmarks) {
        const landmarks = results.poseLandmarks;
        
        currentLineWidth = calculateLineWidth(landmarks);

        const targets = [
          { id: 0,  name: 'head' },
          { id: 11, name: 'leftShoulder' },
          { id: 12, name: 'rightShoulder' },
          { id: 13, name: 'leftElbow' },
          { id: 14, name: 'rightElbow' },
          { id: 15, name: 'leftHand' },
          { id: 16, name: 'rightHand' },
          { id: 23, name: 'leftHip' },
          { id: 24, name: 'rightHip' },
          { id: 25, name: 'leftKnee' },
          { id: 26, name: 'rightKnee' },
          { id: 27, name: 'leftFoot' },
          { id: 28, name: 'rightFoot' }
        ];

        targets.forEach(target => {
          if (!isJointTypeEnabled(target.name)) {
            lastPositions[target.name] = null;
            lastMidPoints[target.name] = null;
            return;
          }

          const point = landmarks[target.id];
          const isVisible = point && point.visibility > VISIBILITY_THRESHOLD && isInsideFrame(point);

          if (isVisible) {
            if (lastPositions[target.name]) {
              const dist = getDistance(lastPositions[target.name], point);
              if (dist > MIN_DISTANCE) {
                const strokeColor = isSpeedColorActive ? getColorBySpeed(dist) : manualColor;
                drawContinuousCurve(target.name, lastPositions[target.name], point, currentLineWidth, strokeColor);
                drawJointMarker(point, strokeColor);
                lastPositions[target.name] = point;
              } else {
                drawJointMarker(point, isSpeedColorActive ? '#000000' : manualColor);
              }
            } else {
              lastPositions[target.name] = point;
              drawJointMarker(point, isSpeedColorActive ? '#000000' : manualColor);
            }
          } else {
            lastPositions[target.name] = null;
            lastMidPoints[target.name] = null;
          }
        });
      } else {
        lastPositions = {};
        lastMidPoints = {};
      }
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({image: videoElement});
      },
      width: 1280,
      height: 720
    });
    
    camera.start();

    // Guardar Foto Manual
    saveButton.addEventListener('click', () => {
      saveModal.style.display = 'flex';
    });

    cancelModal.addEventListener('click', () => {
      saveModal.style.display = 'none';
    });

    function downloadImage(withCameraBackground) {
      const compCanvas = document.createElement('canvas');
      const compCtx = compCanvas.getContext('2d');
      compCanvas.width = window.innerWidth;
      compCanvas.height = window.innerHeight;

      compCtx.save();
      compCtx.scale(-1, 1);

      if (withCameraBackground && isCameraVisible) {
        compCtx.drawImage(videoElement, -compCanvas.width, 0, compCanvas.width, compCanvas.height);
      } else {
        compCtx.fillStyle = '#FFFFFF';
        compCtx.fillRect(-compCanvas.width, 0, compCanvas.width, compCanvas.height);
      }

      compCtx.drawImage(trailCanvas, -compCanvas.width, 0, compCanvas.width, compCanvas.height);

      compCtx.restore();

      const dataURL = compCanvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.href = dataURL;
      link.download = `dibujo-corporal-${withCameraBackground ? 'camara' : 'blanco'}-${Date.now()}.png`;
      link.click();

      saveModal.style.display = 'none';
    }

    saveCameraBg.addEventListener('click', () => downloadImage(true));
    saveWhiteBg.addEventListener('click', () => downloadImage(false));

    // Foto Automática cada 30 segundos (Fondo Blanco)
    autoPhotoButton.addEventListener('click', () => {
      if (!isAutoPhotoActive) {
        isAutoPhotoActive = true;
        autoPhotoButton.textContent = '⏹️ Detener Auto (30s)';
        autoPhotoButton.classList.add('active');

        downloadImage(false);

        autoPhotoInterval = setInterval(() => {
          downloadImage(false);
        }, 30000);
      } else {
        isAutoPhotoActive = false;
        clearInterval(autoPhotoInterval);
        autoPhotoButton.textContent = '⏱️ Foto Auto (30s)';
        autoPhotoButton.classList.remove('active');
      }
    });

    // Grabar Vídeo
    recordButton.addEventListener('click', () => {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    function startRecording() {
      recordedChunks = [];
      
      const renderCanvas = document.createElement('canvas');
      renderCanvas.width = window.innerWidth;
      renderCanvas.height = window.innerHeight;
      const renderCtx = renderCanvas.getContext('2d');

      let animId;
      function drawFrame() {
        renderCtx.save();
        renderCtx.scale(-1, 1);
        if (isCameraVisible) {
          renderCtx.drawImage(videoElement, -renderCanvas.width, 0, renderCanvas.width, renderCanvas.height);
        } else {
          renderCtx.fillStyle = '#FFFFFF';
          renderCtx.fillRect(-renderCanvas.width, 0, renderCanvas.width, renderCanvas.height);
        }
        renderCtx.drawImage(trailCanvas, -renderCanvas.width, 0, renderCanvas.width, renderCanvas.height);
        renderCtx.restore();
        if (isRecording) {
          animId = requestAnimationFrame(drawFrame);
        }
      }

      const stream = renderCanvas.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        cancelAnimationFrame(animId);
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `grabacion-cuerpo-${Date.now()}.webm`;
        a.click();
        URL.revokeObjectURL(url);
      };

      isRecording = true;
      mediaRecorder.start();
      drawFrame();

      recordButton.textContent = '⏹️ Detener Grabación';
      recordButton.classList.add('recording');
    }

    function stopRecording() {
      isRecording = false;
      mediaRecorder.stop();
      recordButton.textContent = '🔴 Grabar Vídeo';
      recordButton.classList.remove('recording');
    }
  </script>
</body>
</html>
